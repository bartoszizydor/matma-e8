lsQXEAJqDC4UPdlWeVZ3W4SiOKXl+56pQOUqJdMYL4IZY="};
const KLUCZ = 'matma-e8-klucz';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const do64 = b => btoa(String.fromCharCode(...b));

async function kluczZHasla(haslo) {
	const baza = await crypto.subtle.importKey('raw', new TextEncoder().encode(haslo), 'PBKDF2', false, ['deriveBits']);
	return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(SZYFR.sol), iterations: SZYFR.powt, hash: 'SHA-256' }, baza, 256));
}
async function odszyfruj(surowy) {
	const k = await crypto.subtle.importKey('raw', surowy, 'AES-GCM', false, ['decrypt']);
	return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(SZYFR.iv) }, k, b64(SZYFR.dane)));
}
function uruchom(js) {
	document.getElementById('wejscie').remove();
	const s = document.createElement('script');
	s.type = 'module';
	s.textContent = js;
	document.body.append(s);
}

const form = document.getElementById('wejscie');
form.addEventListener('submit', async e => {
	e.preventDefault();
	const blad = document.getElementById('blad'), przycisk = form.querySelector('button');
	przycisk.disabled = true;
	blad.textContent = 'Sprawdzam…';
	try {
		const k = await kluczZHasla(document.getElementById('haslo').value);
		const js = await odszyfruj(k);
		// Zapamiętujemy klucz (nie hasło); po zmianie hasła stary klucz przestaje działać i wraca ten ekran.
		try { document.getElementById('zapamietaj').checked ? localStorage.setItem(KLUCZ, do64(k)) : localStorage.removeItem(KLUCZ); } catch {}
		uruchom(js);
	} catch {
		blad.textContent = 'Nieprawidłowe hasło. Spróbuj jeszcze raz.';
		przycisk.disabled = false;
	}
});

(async () => {
	let zapisany = null;
	try { zapisany = localStorage.getItem(KLUCZ); } catch {}
	if (zapisany) {
		try { return uruchom(await odszyfruj(b64(zapisany))); } catch { try { localStorage.removeItem(KLUCZ); } catch {} }
	}
	form.hidden = false;
	document.getElementById('haslo').focus();
})();
</script>
