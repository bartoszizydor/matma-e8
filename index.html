const KLUCZ = 'matma-e8-klucz';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const do64 = b => btoa(String.fromCharCode(...b));

async function aes(surowy, iv, dane) {
	const k = await crypto.subtle.importKey('raw', surowy, 'AES-GCM', false, ['decrypt']);
	return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(iv) }, k, b64(dane)));
}
// Hasło otwiera jeden z zamków (uczeń albo nauczyciel) i wyjmuje z niego klucz treści.
async function otworz(haslo) {
	const baza = await crypto.subtle.importKey('raw', new TextEncoder().encode(haslo), 'PBKDF2', false, ['deriveBits']);
	const kek = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(SZYFR.sol), iterations: SZYFR.powt, hash: 'SHA-256' }, baza, 256));
	for (const z of SZYFR.zamki) {
		try { return { k: await aes(kek, z.iv, z.klucz), rola: z.rola }; } catch {}
	}
	throw new Error('Nieprawidłowe hasło');
}
async function uruchom({ k, rola }) {
	const js = new TextDecoder().decode(await aes(k, SZYFR.iv, SZYFR.dane));
	window.MATMA_ROLA = rola;
	window.MATMA_WYLOGUJ = () => { try { localStorage.removeItem(KLUCZ); } catch {} location.hash = ''; location.reload(); };
	document.getElementById('wejscie').remove();
	const s = document.createElement('script');
	s.type = 'module';
	s.textContent = js;
	document.body.append(s);
}

const form = document.getElementById('wejscie');
form.addEventListener('submit', async e => {
	e.preventDefault();
	const blad = document.getElementById('blad'), przycisk = form.querySelector('button');
	przycisk.disabled = true;
	blad.textContent = 'Sprawdzam…';
	try {
		const dostep = await otworz(document.getElementById('haslo').value);
		// Zapamiętujemy klucz treści i rolę (nie hasło); po zmianie haseł stary klucz przestaje działać i wraca ten ekran.
		try { document.getElementById('zapamietaj').checked ? localStorage.setItem(KLUCZ, JSON.stringify({ k: do64(dostep.k), rola: dostep.rola })) : localStorage.removeItem(KLUCZ); } catch {}
		await uruchom(dostep);
	} catch {
		blad.textContent = 'Nieprawidłowe hasło. Spróbuj jeszcze raz.';
		przycisk.disabled = false;
	}
});

(async () => {
	let zapisany = null;
	try { zapisany = localStorage.getItem(KLUCZ); } catch {}
	if (zapisany) {
		try { const z = JSON.parse(zapisany); return await uruchom({ k: b64(z.k), rola: z.rola }); } catch { try { localStorage.removeItem(KLUCZ); } catch {} }
	}
	form.hidden = false;
	document.getElementById('haslo').focus();
})();
</script>
